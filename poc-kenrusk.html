<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ken Rusk Homepage — Interactive Promo Concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1f3f68;
    --navy2:#294f7d;
    --accent:#e0a73b;
    --brand:#f2c05a;
    --eyebrow:#f2c05a;
    --ctatext:#173257;
    --hfont:'Oswald',sans-serif;
    --bfont:'Barlow Semi Condensed',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1f3f68;font-family:var(--bfont)}

  /* ---- promo bar (minimal, sits at the bottom of the page) ---- */
  .promo{
    width:100%;min-height:42px;background:var(--navy);
    border-top:1px solid rgba(255,255,255,.10);
    display:flex;align-items:center;justify-content:center;
    position:relative;padding:8px 56px;
  }
  .promo .msg{
    color:#e9eef6;font-size:16px;font-weight:400;letter-spacing:.2px;
    text-align:center;line-height:1.3;
  }
  .promo .score{color:var(--brand);font-weight:600;}
  .promo .org{color:#dfe7f2;font-weight:500;}
  .promo .close{
    position:absolute;right:22px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:#c3d0e2;font-size:17px;
    font-family:var(--bfont);cursor:pointer;line-height:1;padding:6px;
    transition:color .15s ease;
  }
  .promo .close:hover{color:#fff;}

  /* ---- the homepage screenshot ---- */
  img.site{display:block;width:100%;height:auto;}

  /* ---- floating dismissible badge (compact, refined) ---- */
  .badge{
    position:fixed;right:24px;bottom:24px;width:320px;min-height:196px;z-index:50;
    background:linear-gradient(158deg, rgba(41,79,125,.90) 0%, rgba(23,50,87,.93) 100%);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    box-shadow:0 14px 34px rgba(0,0,0,.32);
    padding:22px 16px 16px;
    display:flex;gap:14px;align-items:flex-end;
    transition:opacity .3s ease, transform .3s ease;
    animation:badgeIn .7s cubic-bezier(.16,.84,.44,1) .6s both;
  }
  @keyframes badgeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .badge .bclose{
    position:absolute;right:11px;top:10px;
    background:none;border:none;color:#a9bbd4;font-size:15px;
    cursor:pointer;line-height:1;padding:4px;transition:color .15s ease;
  }
  .badge .bclose:hover{color:#fff;}
  .badge .bottle{
    flex:0 0 auto;width:70px;height:150px;border-radius:9px;
    object-fit:cover;object-position:50% 50%;align-self:flex-end;
    margin:0 22px 12px 0;
    box-shadow:0 10px 12px -8px rgba(0,0,0,.55);
  }
  .badge .info{flex:1;min-width:0;align-self:center;}
  .badge .eyebrow{
    font-family:var(--hfont);font-weight:600;font-size:10px;letter-spacing:1.8px;
    color:var(--eyebrow);text-transform:uppercase;margin:0 0 5px;opacity:.95;
  }
  .badge .title{
    font-family:var(--hfont);font-weight:700;font-size:18px;line-height:1.05;
    color:#fff;text-transform:uppercase;margin:0 0 6px;
  }
  .badge .sub{
    color:#c1cfe2;font-size:13px;font-weight:400;line-height:1.35;margin:0 0 12px;
  }
  .badge .donate{
    display:inline-flex;align-items:center;gap:7px;
    font-family:var(--hfont);font-weight:600;font-size:12.5px;letter-spacing:1px;
    text-transform:uppercase;background:var(--accent);color:var(--ctatext);
    padding:9px 16px;border-radius:8px;text-decoration:none;
    transition:filter .15s ease, transform .15s ease;
  }
  .badge .donate .arw{font-family:var(--bfont);font-weight:600;font-size:14px;line-height:1;}
  .badge .donate:hover{filter:brightness(1.06);transform:translateY(-1px);}

  .is-hidden{opacity:0 !important;pointer-events:none;}
  .badge.is-hidden{transform:translateY(14px) !important;}

  @media (max-width:520px){
    .promo .msg{font-size:14px;}
    .badge{right:12px;bottom:12px;width:calc(100% - 24px);max-width:320px;}
  }
</style>
</head>
<body>

<img class="site" src="kenrusk.png" alt="Ken Rusk homepage">

<div class="promo" id="promo">
  <span class="msg">Comfort Peace Freedom Foundation is proud to hold a <span class="score">[X.X / 4 stars]</span> rating from <span class="org">[Charity Rating Organization]</span>.</span>
  <button class="close" onclick="dismiss('promo')" aria-label="Dismiss banner">&#10005;</button>
</div>

<div class="badge" id="badge">
  <button class="bclose" onclick="dismiss('badge')" aria-label="Dismiss badge">&#10005;</button>
  <div class="info">
    <p class="eyebrow">Freedom Bourbon</p>
    <p class="title">Support Our Troops</p>
    <p class="sub">100% of profits go to our veterans.</p>
    <a class="donate" href="landing-kenrusk.html">Donate Now <span class="arw">&rarr;</span></a>
  </div>
  <img class="bottle" src="images/CPF-Bourbon-Bottle-badge.png" alt="Freedom Bourbon bottle">
</div>

<script>
  function dismiss(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.classList.add('is-hidden');
    setTimeout(function(){ el.style.display = 'none'; }, 300);
  }
</script>

</body>
</html>
